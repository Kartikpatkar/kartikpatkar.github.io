<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 620" width="100%" height="100%" role="presentation" aria-hidden="true">
  <defs>
    <pattern id="microGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="currentColor" stroke-width="0.75" stroke-opacity="0.07" />
      <circle cx="24" cy="24" r="0.8" fill="currentColor" fill-opacity="0.18" />
    </pattern>
    <pattern id="hexTech" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="1.2" fill="currentColor" fill-opacity="0.14" />
      <path d="M 0 24 L 24 0 L 48 24 L 24 48 Z" fill="none" stroke="currentColor" stroke-width="0.5" stroke-opacity="0.04" />
    </pattern>
    <linearGradient id="cyberFade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.15" />
      <stop offset="50%" stop-color="currentColor" stop-opacity="0.03" />
      <stop offset="100%" stop-color="currentColor" stop-opacity="0.12" />
    </linearGradient>
  </defs>

  <!-- Base Grid Fill -->
  <rect width="100%" height="100%" fill="url(#microGrid)" />
  <rect width="100%" height="100%" fill="url(#hexTech)" />

  <!-- Diagonal Tech Slits / Racing Stripe -->
  <g opacity="0.35">
    <line x1="-40" y1="120" x2="220" y2="-60" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.1" />
    <line x1="-20" y1="140" x2="240" y2="-40" stroke="currentColor" stroke-width="0.8" stroke-dasharray="4 6" stroke-opacity="0.15" />
    <line x1="200" y1="640" x2="460" y2="460" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.1" />
  </g>

  <!-- Circuit Traces / Nodes -->
  <g opacity="0.45" stroke="currentColor" stroke-width="1" fill="none">
    <path d="M 32 90 L 32 140 L 52 160 L 52 210" stroke-opacity="0.25" />
    <circle cx="52" cy="210" r="2.5" fill="currentColor" fill-opacity="0.4" />

    <path d="M 388 480 L 388 430 L 368 410 L 368 360" stroke-opacity="0.25" />
    <circle cx="368" cy="360" r="2.5" fill="currentColor" fill-opacity="0.4" />
  </g>

  <!-- Corner Brackets -->
  <g stroke="currentColor" stroke-width="2" stroke-opacity="0.3" fill="none">
    <!-- Top-Left -->
    <path d="M 18 36 L 18 18 L 36 18" />
    <!-- Top-Right -->
    <path d="M 384 18 L 402 18 L 402 36" />
    <!-- Bottom-Left -->
    <path d="M 18 584 L 18 602 L 36 602" />
    <!-- Bottom-Right -->
    <path d="M 384 602 L 402 602 L 402 584" />
  </g>

  <!-- Subtle Blueprint Tech Watermarks -->
  <g fill="currentColor" opacity="0.12" font-family="'Courier New', monospace" font-size="8" letter-spacing="1.5">
    <text x="24" y="32">SYS:SFDC//2026.1</text>
    <text x="310" y="32">SEC_LVL_04</text>
    <text x="24" y="596">KP_DEV_CREDENTIAL</text>
    <text x="330" y="596">NODE:APEX_01</text>
  </g>
</svg>
